<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugasku INFTIK</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #222;
    background: #f5efff;
}


/* =========================
   HALAMAN PASSWORD
========================= */

#halamanKode {
    min-height: 100vh;
    padding: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #32105f,
        #a044ff
    );
}

.kotak-kode {
    width: 100%;
    max-width: 430px;

    padding: 35px 25px;

    background: white;

    border-radius: 24px;

    text-align: center;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.30);
}

.ikon {
    font-size: 60px;
}

.kotak-kode h1 {
    margin: 10px 0;

    color: #32105f;

    font-size: 36px;
}

.keterangan {
    color: #666;

    font-size: 17px;

    line-height: 1.6;
}

#kodeRahasia {
    width: 100%;

    margin-top: 10px;

    padding: 15px;

    border: 2px solid #ddd;

    border-radius: 12px;

    font-size: 16px;

    outline: none;
}

#kodeRahasia:focus {
    border-color: #7224c9;
}

.tombol {
    width: 100%;

    margin-top: 16px;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #7224c9;

    color: white;

    font-size: 17px;

    font-weight: bold;
}

#pesanSalah {
    min-height: 25px;

    margin-top: 15px;

    color: red;

    font-weight: bold;
}


/* =========================
   HALAMAN UTAMA
========================= */

#halamanUtama {
    display: none;

    min-height: 100vh;

    padding: 20px;
}

.container {
    width: 100%;

    max-width: 850px;

    margin: auto;
}

.judul {
    margin: 5px 0;

    text-align: center;

    color: #32105f;

    font-size: 34px;
}

.subjudul {
    margin-top: 5px;

    text-align: center;

    color: #666;

    font-size: 17px;
}


/* =========================
   JAM
========================= */

.jam {
    margin: 20px 0;

    padding: 15px;

    border-radius: 14px;

    background: #32105f;

    color: white;

    text-align: center;

    font-size: 18px;

    font-weight: bold;
}


/* =========================
   KARTU GAMBAR
========================= */

.kartu {
    margin-bottom: 25px;

    padding: 15px;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);
}

.kartu h2 {
    margin-top: 0;

    margin-bottom: 15px;

    color: #32105f;

    font-size: 23px;
}

.kartu img {
    display: block;

    width: 100%;

    height: auto;

    border-radius: 12px;
}


/* =========================
   FOOTER
========================= */

.footer {
    padding: 25px;

    text-align: center;

    color: #777;
}


/* =========================
   HP
========================= */

@media (max-width: 600px) {

    #halamanKode {
        padding: 15px;
    }

    .kotak-kode {
        padding: 30px 20px;
    }

    .kotak-kode h1 {
        font-size: 32px;
    }

    #halamanUtama {
        padding: 15px;
    }

    .judul {
        font-size: 29px;
    }

}
</style>
</head>


<body>


<!-- =====================================
     HALAMAN KODE RAHASIA
===================================== -->

<section id="halamanKode">

    <div class="kotak-kode">

        <div class="ikon">
            🔐
        </div>

        <h1>
            Selamat Datang
        </h1>

        <p class="keterangan">
            Masukkan kode rahasia untuk membuka
            halaman Tugasku INFTIK.
        </p>

        <input
            type="password"
            id="kodeRahasia"
            placeholder="Masukkan kode rahasia"
            autocomplete="off"
        >

        <button
            class="tombol"
            onclick="bukaHalaman()"
        >
            Buka Halaman
        </button>

        <div id="pesanSalah"></div>

    </div>

</section>



<!-- =====================================
     HALAMAN UTAMA
===================================== -->

<section id="halamanUtama">

    <div class="container">

        <h1 class="judul">
            Tugasku INFTIK
        </h1>

        <p class="subjudul">
            Profil dan tugas siswa
        </p>


        <!-- JAM -->

        <div
            class="jam"
            id="jamWIB"
        >
            Memuat waktu WIB...
        </div>



        <!-- =================================
             SAMPUL
        ================================= -->

        <div class="kartu">

            <h2>
                Sampul INFTIK
            </h2>

            <img
                src="sampul-inftik.jpg"
                alt="Sampul INFTIK"
            >

        </div>



        <!-- =================================
             DATA PROFIL
        ================================= -->

        <div class="kartu">

            <h2>
                Data Profil Siswa
            </h2>

            <img
                src="data-profil.jpg"
                alt="Data Profil Siswa"
            >

        </div>



        <!-- =================================
             RIWAYAT PENDIDIKAN
        ================================= -->

        <div class="kartu">

            <h2>
                Riwayat Pendidikan
            </h2>

            <img
                src="riwayat-pendidikan.jpg"
                alt="Riwayat Pendidikan"
            >

        </div>



        <!-- =================================
             RIWAYAT PRESTASI
        ================================= -->

        <div class="kartu">

            <h2>
                Riwayat Prestasi
            </h2>

            <img
                src="riwayat-prestasi.jpg"
                alt="Riwayat Prestasi"
            >

        </div>



        <!-- =================================
             HOBI DAN MINAT
        ================================= -->

        <div class="kartu">

            <h2>
                Hobi dan Minat
            </h2>

            <img
                src="hobi-minat.jpg"
                alt="Hobi dan Minat"
            >

        </div>



        <div class="footer">
            © Tugasku INFTIK
        </div>

    </div>

</section>



<script>

/* =====================================
   PASSWORD
===================================== */

function bukaHalaman() {

    const kode =
        document
        .getElementById("kodeRahasia")
        .value
        .trim();

    const pesan =
        document
        .getElementById("pesanSalah");

    if (kode === "tugaskuperintahku") {

        document
        .getElementById("halamanKode")
        .style.display = "none";

        document
        .getElementById("halamanUtama")
        .style.display = "block";

        pesan.textContent = "";

        window.scrollTo(0, 0);

    } else {

        pesan.textContent =
            "❌ Kode rahasia salah!";

    }
}


/* =====================================
   TOMBOL ENTER
===================================== */

document
.getElementById("kodeRahasia")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            bukaHalaman();
        }

    }
);


/* =====================================
   JAM WIB
===================================== */

function tampilkanJam() {

    const sekarang = new Date();

    const waktu =
        new Intl.DateTimeFormat(
            "id-ID",
            {
                timeZone: "Asia/Jakarta",

                weekday: "long",

                year: "numeric",

                month: "long",

                day: "numeric",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"
            }
        ).format(sekarang);

    document
    .getElementById("jamWIB")
    .textContent =
        "WIB: " + waktu;
}

tampilkanJam();

setInterval(
    tampilkanJam,
    1000
);

</script>

</body>
  </html>
