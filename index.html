<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tugasku INFTIK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* =========================
       HALAMAN UMUM
    ========================= */

    .halaman {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       HALAMAN PASSWORD
    ========================= */

    #halamanKode {
      background: linear-gradient(135deg, #32105f, #a044ff);
    }

    .kotak-kode {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .ikon {
      font-size: 52px;
    }

    .kotak-kode h1 {
      color: #32105f;
    }

    .keterangan {
      color: #666;
      line-height: 1.6;
    }

    input {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      color: white;
      background: #7224c9;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #521491;
    }

    #pesanSalah {
      min-height: 22px;
      margin-top: 14px;
      color: red;
      font-weight: bold;
    }
