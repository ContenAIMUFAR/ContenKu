<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugasku INFTIK</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4effa;
    color: #222;
}


/* =========================
   HALAMAN PASSWORD
========================= */

#halamanKode {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background: linear-gradient(
        135deg,
        #32105f,
        #a044ff
    );
}

.kotak-kode {
    width: 100%;
    max-width: 430px;

    background: white;

    padding: 35px 25px;

    border-radius: 24px;

    text-align: center;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.30);
}

.ikon {
    font-size: 60px;
    margin-bottom: 10px;
}

.kotak-kode h1 {
    margin: 10px 0;

    color: #32105f;

    font-size: 36px;
}

.keterangan {
    color: #666;

    font-size: 17px;

    line-height: 1.6;

    margin-bottom: 25px;
}

#kodeRahasia {
    width: 100%;

    padding: 15px;

    border: 2px solid #d0d0d0;

    border-radius: 12px;

    font-size: 16px;

    outline: none;
}

#kodeRahasia:focus {
    border-color: #7224c9;
}

.tombol {
    width: 100%;

    margin-top: 16px;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #7224c9;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.tombol:hover {
    background: #5b18a5;
}

#pesanSalah {
    min-height: 25px;

    margin-top: 15px;

    color: #e00000;

    font-weight: bold;
}


/* =========================
   HALAMAN UTAMA
========================= */

#halamanUtama {
    display: none;

    min-height: 100vh;

    padding: 20px;
}

.container {
    width: 100%;

    max-width: 850px;

    margin: auto;
}

.judul {
    margin: 5px 0;

    text-align: center;

    color: #32105f;

    font-size: 34px;
}

.subjudul {
    margin-top: 5px;

    margin-bottom: 20px;

    text-align: center;

    color: #666;

    font-size: 16px;
}


/* =========================
   JAM
========================= */

.jam {
    margin-bottom: 22px;

    padding: 14px;

    background: #32105f;

    color: white;

    border-radius: 12px;

    text-align: center;

    font-weight: bold;
}


/* =========================
   KARTU
========================= */

.kartu {
    margin-bottom: 25px;

    padding: 15px;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);
}

.kartu h2 {
    margin-top: 0;

    margin-bottom: 14px;

    color: #32105f;

    font-size: 21px;
}


/* =========================
   GAMBAR
========================= */

.kartu img {
    display: block;

    width: 100%;

    height: auto;

    border-radius: 12px;
}


/* =========================
   ERROR GAMBAR
========================= */

.gambarTidakAda {
    padding: 20px;

    background: #ffe7e7;

    color: #d00000;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;
}


/* =========================
   FOOTER
========================= */

.footer {
    padding: 25px 0;

    text-align: center;

    color: #777;
}


/* =========================
   TAMPILAN HP
========================= */

@media (max-width: 600px) {

    #halamanKode {
        padding: 15px;
    }

    .kotak-kode {
        padding: 30px 20px;
    }

    .kotak-kode h1 {
        font-size: 32px;
    }

    #halamanUtama {
        padding: 15px;
    }

    .judul {
        font-size: 28px;
    }

}
</style>
</head>


<body>


<!-- ==================================
     HALAMAN PASSWORD
================================== -->

<section id="halamanKode">

    <div class="kotak-kode">

        <div class="ikon">🔐</div>

        <h1>
            Selamat Datang
        </h1>

        <p class="keterangan">
            Masukkan kode rahasia untuk membuka
            halaman Tugasku INFTIK.
        </p>

        <input
            id="kodeRahasia"
            type="password"
            placeholder="Masukkan kode rahasia"
            autocomplete="off"
        >

        <button
            class="tombol"
            type="button"
            onclick="bukaHalaman()"
        >
            Buka Halaman
        </button>

        <div id="pesanSalah"></div>

    </div>

</section>



<!-- ==================================
     HALAMAN UTAMA
================================== -->

<section id="halamanUtama">

    <div class="container">

        <h1 class="judul">
            Tugasku INFTIK
        </h1>

        <p class="subjudul">
            Profil dan tugas siswa
        </p>


        <!-- JAM WIB -->

        <div
            class="jam"
            id="jamWIB"
        >
            Memuat waktu...
        </div>


        <!-- ==================================
             GAMBAR 1
        ================================== -->

        <div class="kartu">

            <h2>
                Sampul INFTIK
            </h2>

            <img
                src="./images/sampul-inftik.jpg"
                alt="Sampul INFTIK"
                onerror="gambarError(this, 'Sampul INFTIK')"
            >

        </div>


        <!-- ==================================
             GAMBAR 2
        ================================== -->

        <div class="kartu">

            <h2>
                Data Profil Siswa
            </h2>

            <img
                src="./images/data-profil.jpg"
                alt="Data Profil Siswa"
                onerror="gambarError(this, 'Data Profil Siswa')"
            >

        </div>


        <!-- ==================================
             GAMBAR 3
        ================================== -->

        <div class="kartu">

            <h2>
                Riwayat Pendidikan
            </h2>

            <img
                src="./images/riwayat-pendidikan.jpg"
                alt="Riwayat Pendidikan"
                onerror="gambarError(this, 'Riwayat Pendidikan')"
            >

        </div>


        <!-- ==================================
             GAMBAR 4
        ================================== -->

        <div class="kartu">

            <h2>
                Riwayat Prestasi
            </h2>

            <img
                src="./images/riwayat-prestasi.jpg"
                alt="Riwayat Prestasi"
                onerror="gambarError(this, 'Riwayat Prestasi')"
            >

        </div>


        <!-- ==================================
             GAMBAR 5
        ================================== -->

        <div class="kartu">

            <h2>
                Hobi dan Minat
            </h2>

            <img
                src="./images/hobi-minat.jpg"
                alt="Hobi dan Minat"
                onerror="gambarError(this, 'Hobi dan Minat')"
            >

        </div>


        <div class="footer">
            © Tugasku INFTIK
        </div>

    </div>

</section>



<script>

/* ==================================
   PASSWORD
================================== */

function bukaHalaman() {

    const input =
        document.getElementById("kodeRahasia");

    const kode =
        input.value.trim();

    const pesan =
        document.getElementById("pesanSalah");

    const halamanKode =
        document.getElementById("halamanKode");

    const halamanUtama =
        document.getElementById("halamanUtama");


    /*
       PASSWORD WEBSITE
       =================
       tugaskuperintahku
    */

    if (kode === "tugaskuperintahku") {

        halamanKode.style.display = "none";

        halamanUtama.style.display = "block";

        pesan.textContent = "";

        window.scrollTo(0, 0);

    } else {

        pesan.textContent =
            "❌ Kode rahasia salah!";

    }

}


/* ==================================
   ENTER UNTUK MEMBUKA
================================== */

document
    .getElementById("kodeRahasia")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                bukaHalaman();

            }

        }
    );


/* ==================================
   JAM WIB
================================== */

function tampilkanJam() {

    const sekarang = new Date();

    const waktu =
        new Intl.DateTimeFormat(
            "id-ID",
            {
                timeZone: "Asia/Jakarta",

                weekday: "long",

                year: "numeric",

                month: "long",

                day: "numeric",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"
            }
        ).format(sekarang);

    document
        .getElementById("jamWIB")
        .textContent =
        "WIB: " + waktu;

}

tampilkanJam();

setInterval(
    tampilkanJam,
    1000
);


/* ==================================
   JIKA GAMBAR TIDAK DITEMUKAN
================================== */

function gambarError(gambar, nama) {

    const pesan =
        document.createElement("div");

    pesan.className =
        "gambarTidakAda";

    pesan.textContent =
        "Gambar " +
        nama +
        " belum ditemukan.";

    gambar.replaceWith(pesan);

}

</script>

</body>
  </html>
