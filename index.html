<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugasku INFTIK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
}

/* =========================
   HALAMAN PASSWORD
========================= */

#halamanKode {
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #32105f, #a044ff);
}

.kotak-kode {
  width: 100%;
  max-width: 430px;
  padding: 35px 25px;
  text-align: center;
  background: white;
  border-radius: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.ikon {
  font-size: 55px;
}

.kotak-kode h1 {
  color: #32105f;
  font-size: 38px;
}

.keterangan {
  color: #666;
  line-height: 1.6;
  font-size: 17px;
}

input {
  width: 100%;
  margin-top: 10px;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #7224c9;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  color: white;
  background: #7224c9;
  font-size: 17px;
  font-weight: bold;
}

#pesanSalah {
  min-height: 25px;
  margin-top: 14px;
  color: red;
  font-weight: bold;
}


/* =========================
   HALAMAN TUGAS
========================= */

#halamanFoto {
  display: none;
  min-height: 100vh;
  padding: 20px;
  background: linear-gradient(135deg, #f5efff, #ffffff);
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
}

.judul {
  text-align: center;
  color: #32105f;
  font-size: 32px;
}

.subjudul {
  text-align: center;
  color: #666;
}

.jam {
  margin: 20px 0;
  padding: 14px;
  text-align: center;
  color: white;
  background: #32105f;
  border-radius: 12px;
  font-weight: bold;
}


/* =========================
   GAMBAR
========================= */

.kartu {
  margin-bottom: 25px;
  padding: 15px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.kartu h2 {
  margin-top: 0;
  color: #32105f;
  font-size: 21px;
}

.kartu img
