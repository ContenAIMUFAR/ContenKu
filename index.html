<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tugasku INFTIK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* =========================
       HALAMAN UMUM
    ========================= */

    .halaman {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       HALAMAN PASSWORD
    ========================= */

    #halamanKode {
      background: linear-gradient(135deg, #32105f, #a044ff);
    }

    .kotak-kode {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .ikon {
      font-size: 52px;
    }

    .kotak-kode h1 {
      color: #32105f;
      margin-bottom: 10px;
    }

    .keterangan {
      color: #666;
      line-height: 1.6;
    }

    input {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      color: white;
      background: #7224c9;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #521491;
    }

    #pesanSalah {
      min-height: 22px;
      margin-top: 14px;
      color: red;
      font-weight: bold;
    }

    /* =========================
       HALAMAN TUGAS
    ========================= */

    #halamanFoto {
      display: none;
      min-height: 100vh;
      align-items: flex-start;
      background: linear-gradient(135deg, #f5efff, #ffffff);
      padding: 20px;
    }

    .isi-tugas {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .judul {
      text-align: center;
      color: #32105f;
      margin-bottom: 10px;
    }

    .subjudul {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    /* =========================
       JAM
    ========================= */

    .jam {
      text-align: center;
      background: #32105f;
      color: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* =========================
       KARTU GAMBAR
    ========================= */

    .kartu-gambar {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .kartu-gambar h2 {
      color: #32105f;
      font-size: 20px;
      margin-top: 0;
    }

    .kartu-gambar img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* =========================
       PESAN GAMBAR
    ========================= */

    .gambar-error {
      padding: 20px;
      text-align: center;
      color: red;
      background: #ffecec;
      border-radius: 10px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    /* =========================
       HP
    ========================= */

    @media (max-width: 600px) {
      .halaman {
        padding: 15px;
      }

      #halamanFoto {
        padding: 15px;
      }

      .kotak-kode {
        padding: 30px 20px;
      }

      .judul {
        font-size: 27px;
      }

      .kartu-gambar h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HALAMAN KODE RAHASIA
  ========================= -->

  <section id="halamanKode" class="halaman">

    <div class="kotak-kode">

      <div class="ikon">🔐</div>

      <h1>Selamat Datang</h1>

      <p class="keterangan">
        Masukkan kode rahasia untuk membuka
        halaman Tugasku INFTIK.
      </p>

      <input
        type="password"
        id="kodeRahasia"
        placeholder="Masukkan kode rahasia"
      >

      <button onclick="bukaHalaman()">
        Buka Halaman
      </button>

      <div id="pesanSalah"></div>

    </div>

  </section>


  <!-- =========================
       HALAMAN TUGAS
  ========================= -->

  <section id="halamanFoto" class="halaman">

    <div class="isi-tugas">

      <h1 class="judul">
        Tugasku INFTIK
      </h1>

      <p class="subjudul">
        Kumpulan tugas dan data profil
      </p>

      <!-- JAM WIB -->

      <div class="jam" id="jamWIB">
        WIB: Memuat waktu...
      </div>


      <!-- SAMPUL -->

      <div class="kartu-gambar">

        <h2>Sampul INFTIK</h2>

        <img
          src="images/sampul-inftik.jpg"
          alt="Sampul INFTIK"
          onerror="tampilkanError(this, 'Sampul INFTIK')"
        >

      </div>


      <!-- DATA PROFIL -->

      <div class="kartu-gambar">

        <h2>Data Profil Siswa</h2>

        <img
          src="images/data-profil.jpg"
          alt="Data Profil Siswa"
          onerror="tampilkanError(this, 'Data Profil Siswa')"
        >

      </div>


      <!-- RIWAYAT PENDIDIKAN -->

      <div class="kartu-gambar">

        <h2>Riwayat Pendidikan</h2>

        <img
          src="images/riwayat-pendidikan.jpg"
          alt="Riwayat Pendidikan"
          onerror="tampilkanError(this, 'Riwayat Pendidikan')"
        >

      </div>


      <!-- RIWAYAT PRESTASI -->

      <div class="kartu-gambar">

        <h2>Riwayat Prestasi</h2>

        <img
          src="images/riwayat-prestasi.jpg"
          alt="Riwayat Prestasi"
          onerror="tampilkanError(this, 'Riwayat Prestasi')"
        >

      </div>


      <!-- HOBI DAN MINAT -->

      <div class="kartu-gambar">

        <h2>Hobi dan Minat</h2>

        <img
          src="images/hobi-minat.jpg"
          alt="Hobi dan Minat"
          onerror="tampilkanError(this, 'Hobi dan Minat')"
        >

      </div>


      <div class="footer">
        © Tugasku INFTIK
      </div>

    </div>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    function bukaHalaman() {

      const kode =
        document.getElementById("kodeRahasia").value;

      const halamanKode =
        document.getElementById("halamanKode");

      const halamanFoto =
        document.getElementById("halamanFoto");

      const pesanSalah =
        document.getElementById("pesanSalah");


      if (kode === "SuaraKuTugas1") {

        halamanKode.style.display = "none";

        halamanFoto.style.display = "flex";

        pesanSalah.textContent = "";

        window.scrollTo(0, 0);

      } else {

        pesanSalah.textContent =
          "❌ Kode rahasia salah!";

      }

    }

    ========================= */
